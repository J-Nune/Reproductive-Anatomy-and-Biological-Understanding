<h3>What are the possible benefits and risks?</h3><p>There is no direct benefit to you, but you may learn something and you will help our research.</p><p>Some questions and topics concern reproductive anatomy and sexual biology, and some people may find this uncomfortable. You can skip the rest of the activity at any time by closing the page. The activity is educational and is not medical advice. ChatGPT can make mistakes, so if you have a health concern please speak to a doctor or another qualified professional. The research team will read the chat that you share, so please check that you are comfortable with that.</p>

const mcItems=key=>bank[pathway][key].map((q,i)=>({k:'mc',q:q[0],o:[2,0,3,1].map(x=>(x+i)%4).map(j=>[j,q[1][j]]),get:()=>data[key+'Answers']?.[i],set:v=>{(data[key+'Answers']??=[])[i]=v;}}));
const confItems=()=>confidenceItems.map((s,i)=>({k:'sc',sec:i?'':'How would you rate your current knowledge?',q:s,labels:['Strongly disagree','Disagree','Neither agree nor disagree','Agree','Strongly agree'],get:()=>data.confidence?.[i],set:v=>{(data.confidence??=[])[i]=v;}}));
function quiz(c){Q=c;const n=c.items.length,min=c.intro?-1:0;if(qi<min)qi=min;
if(qi<0){view(`<div class="eyebrow">${c.eyebrow}</div>${c.intro}${acts('qNav(-1)','Start','qNav(1)')}`);return;}
const it=c.items[qi],cur=it.get(),ok=cur!==undefined&&String(cur).trim()!=='';let body='';
if(it.k==='mc')body=`<div class="opts" role="radiogroup">${it.o.map(([j,t],k)=>`<label class="opt"><input type="radio" name="a" value="${j}" ${cur===j?'checked':''}><b>${'ABCD'[k]}</b><span>${esc(t)}</span></label>`).join('')}</div>`;
else if(it.k==='sc')body=`<div class="scale" role="radiogroup">${it.labels.map((t,j)=>`<label class="key"><input type="radio" name="a" value="${j+1}" ${cur===j+1?'checked':''}><b>${j+1}</b><span>${t}</span></label>`).join('')}</div>`;
else body=`<textarea id="ta" aria-label="Your answer (optional)" placeholder="Write your answer here.">${esc(cur)}</textarea>`;
view(`<div class="qhead"><span class="eyebrow">${c.eyebrow}</span><span class="count">${qi+1} / ${n}</span></div><div class="qdots">${c.items.map((x,i)=>`<i class="${i<qi?'on':i===qi?'now':''}"></i>`).join('')}</div>${it.sec?`<div class="sec">${it.sec}</div>`:''}<h2 class="q">${esc(it.q)}</h2>${body}${acts('qNav(-1)',qi===n-1?c.doneLabel:'Next','qNav(1)',!ok)}`);
app.querySelectorAll('input[type=radio]').forEach(e=>e.onchange=()=>{it.set(Number(e.value));$('next').disabled=false;save();});
const ta=$('ta');if(ta){ta.oninput=()=>{it.set(ta.value);$('next').disabled=!ta.value.trim();};}}
function qNav(d){const n=Q.items.length,min=Q.intro?-1:0;
if(d<0){if(qi>min){qi--;quiz(Q);}else Q.back();return;}
if(qi<n-1){qi++;quiz(Q);window.scrollTo(0,0);}else Q.done();}
function score(key,a){return a.reduce((s,v,i)=>s+(v===bank[pathway][key][i][2]?1:0),0);}

function pretest(){quiz({eyebrow:'Pre-test',doneLabel:'Submit pre-test',items:[...mcItems('pre'),...confItems()],back:()=>setStage(3),done:submitPretest,
intro:`<h2>Before you start</h2><div class="notice warn"><b>Important:</b> Complete this pre-test using only what you already know. Do not use ChatGPT, other AI tools, the internet, notes, books, or help from another person. Choose the answer that you believe is correct.</div><p>There are six knowledge questions, followed by three confidence statements. Answer all of them before moving on.</p>`});}
function submitPretest(){const a=data.preAnswers,c=data.confidence;if(!a||!c||a.length<6||a.includes(undefined)||c.length<3||c.includes(undefined))return;data.preScore=score('pre',a);data.confidenceAverage=c.reduce((x,y)=>x+y,0)/3;data.eligible=!(data.preScore>=3&&data.confidenceAverage>=3);data.criteriaVersion='v2';data.preCompletedAt=new Date().toISOString();setStage(5);}

function eligibility(){const e=data.eligible,hiS=data.preScore>=3,hiC=data.confidenceAverage>=3;
const row=(k,v,r,t)=>`<div class="spec"><div><div class="k">${k}</div><div class="rule">${r}</div></div><div class="v">${v}</div><div class="st">${t}</div></div>`;
view(`<div class="eyebrow">Participation criteria</div><h2>${e?'You can continue':'Thank you for your time'}</h2><div style="margin-top:20px">${row('Pre-test score',data.preScore+'/6','Out of 6',hiS?'3 or above':'Below 3')}${row('Average confidence',data.confidenceAverage.toFixed(2)+'/5','Out of 5',hiC?'3 or above':'Below 3')}</div><div class="verdict"><span class="lamp ${e?'on':''}"></span><div>${e?'Based on your responses, you can continue to the learning activity.':'Based on your responses, you do not need to continue to the next part of this activity. Thank you for your time.'}</div></div><p class="fine">Participants continue to the learning activity unless both their knowledge score (out of 6) and their average confidence rating (out of 5) are 3 or above.</p><div class="actions"><span></span>${e?'<button class="btn primary" onclick="setStage(6)">Continue to learning activity →</button>':'<button class="btn primary" onclick="setStage(10)">Finish →</button>'}</div>`);}

const INFO=`<div class="crit" role="note"><div class="crit-h"><i></i>Required for this study</div><div class="crit-t">Use your own ChatGPT account, in a new tab, and keep the chat so you can share it next.</div><div class="flow"><div class="fs"><div class="fc"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span class="fn">1</span></div><div><b>Your own account</b><span>Sign in to your personal ChatGPT account.</span></div></div><div class="fs"><div class="fc"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 6V4h6v2"/></svg><span class="fn">2</span></div><div><b>A new tab</b><span>Open ChatGPT in a new browser tab. Keep this page open.</span></div></div><div class="fs"><div class="fc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="fn">3</span></div><div><b>A regular chat</b><span>Start a new, regular chat. Not Temporary Chat.</span></div></div><div class="fs"><div class="fc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span class="fn">4</span></div><div><b>Save the log</b><span>Keep the chat in your history. You will share a link to it on the next page.</span></div></div></div><div class="nots"><span><em>✕</em>No shared or borrowed accounts</span><span><em>✕</em>No Temporary Chat</span><span><em>✕</em>No deleting the chat</span><span><em>✕</em>No other AI tools</span></div></div>`;
function exploration(){const topics=pathway==='female'?['Basic female reproductive anatomy','Vulva vs. vagina','Vaginal discharge and its functions','The menstrual cycle']:['Basic male reproductive anatomy','Penis vs. scrotum','Semen vs. pre-ejaculate','Sperm production and ejaculation'];
view(`<div class="eyebrow">Learning activity</div><h2>Explore the topic with ChatGPT</h2>${INFO}<div class="assign"><b>Your assigned topic</b>${esc(data.module)}</div><div class="key-instruction">Use your personal ChatGPT account to ask questions, clarify concepts, and explore anything you feel would help you understand the subject.</div><h3>Topics to explore</h3><div class="topics">${topics.map((t,i)=>`<div class="topic"><i>0${i+1}</i>${t}</div>`).join('')}</div><h3>Instructions</h3><ol class="how"><li>Open ChatGPT in a new browser tab and sign in to your personal account.</li><li>Start a new, regular chat. Do not use Temporary Chat.</li><li>Explore the topics above and ask any questions that you feel would help you understand them.</li><li>Do not type personal details about yourself (such as your full name, address or health problems) into the chat. The research team will be able to read it.</li><li>Use the time to learn naturally. You do not need to follow a script or ask every possible question.</li><li>Make sure the chat is saved in your history. On the next page you will share a link to it with the research team.</li><li>Return to this page when you are finished.</li></ol><div class="notice warn"><b>Time:</b> Spend approximately 10–15 minutes exploring. The timer below is a guide. Please do not use other AI tools or external learning resources for this activity.</div><div class="timerbox"><div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle class="tr" cx="66" cy="66" r="60"/><circle class="pr" id="ringp" cx="66" cy="66" r="60" stroke-dasharray="377" stroke-dashoffset="0"/></svg><div class="timer" id="timer">15:00</div></div><div class="tcol"><small>Suggested activity timer</small><div class="trow"><button class="btn soft" id="tbtn" onclick="toggleTimer()">Start timer</button><button class="btn ghost" onclick="resetTimer()">Reset</button></div></div></div><h3>Before you continue, confirm</h3>${['I used my own personal ChatGPT account.','I opened ChatGPT in a new tab and used a regular chat, not Temporary Chat.','I kept the chat in my history so I can share a link to it.'].map(t=>`<label class="check" style="margin:8px 0"><input type="checkbox" class="cf" ${data.chatConfirmed?'checked':''}><i></i><span>${t}</span></label>`).join('')}<div class="actions"><button class="btn ghost" onclick="setStage(5)">← Back</button><button class="btn primary" id="fin" onclick="finishExploration()" ${data.chatConfirmed?'':'disabled'}>I have finished exploring →</button></div>`);updateTimer();const cf=()=>{$('fin').disabled=![...document.querySelectorAll('.cf')].every(c=>c.checked);};document.querySelectorAll('.cf').forEach(c=>c.onchange=cf);}
function toggleTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;updateTimer();return;}if(secondsLeft<=0)return;timerInt=setInterval(()=>{if(secondsLeft>0){secondsLeft--;save();}if(secondsLeft<=0){clearInterval(timerInt);timerInt=null;}updateTimer();},1000);updateTimer();}
function resetTimer(){clearInterval(timerInt);timerInt=null;secondsLeft=900;updateTimer();}
function updateTimer(){const el=$('timer');if(!el)return;el.textContent=String(Math.floor(secondsLeft/60)).padStart(2,'0')+':'+String(secondsLeft%60).padStart(2,'0');$('ringp').style.strokeDashoffset=377*(1-secondsLeft/900);$('tbtn').textContent=timerInt?'Pause':secondsLeft<=0?'Time elapsed':secondsLeft<900?'Resume':'Start timer';$('tbtn').disabled=secondsLeft<=0;}
function finishExploration(){if(![...document.querySelectorAll('.cf')].every(c=>c.checked))return;data.chatConfirmed=true;clearInterval(timerInt);timerInt=null;data.explorationCompleted=true;data.explorationDurationSeconds=900-secondsLeft;data.explorationFinishedAt=new Date().toISOString();setStage(7);}

const SHARE_RE=/^https:\/\/(chatgpt\.com|chat\.openai\.com)\/share\/\S+$/i;
function sharechat(){view(`<div class="eyebrow">Share your chat</div><h2>Share the link to your ChatGPT chat</h2><p class="lead">Please send the research team the chat you just had with ChatGPT.</p><ol class="how"><li>Go back to your ChatGPT tab. <b>Finish your conversation first.</b> Messages sent after you create the link will not be shared.</li><li>Click the <b>Share</b> icon at the top right of the chat.</li><li>In the \u201cShare link to chat\u201d window, click the blue <b>Share link</b> button, then copy the link.</li><li>Paste the link in the box below.</li></ol><figure class="shot"><a href="share-link-example.png" target="_blank" rel="noopener"><img src="share-link-example.png" alt="ChatGPT window with the Share icon at the top right and the Share link to chat dialog open. The Share icon and the blue Share link button are outlined in orange."></a><figcaption>Example only (a different chat). The two outlined spots are the Share icon (top right) and the Share link button. Your screen may look slightly different. Tap the image to enlarge it.</figcaption></figure><div class="notice"><b>Good to know:</b> anyone who has the link can view the shared chat, but your custom instructions are not shared. If you see an option to make the chat discoverable or searchable, leave it off. To check that your link works, paste it into a private or incognito window.</div><label class="field" for="chatlink">Link to your shared chat</label><input id="chatlink" type="url" inputmode="url" autocomplete="off" placeholder="https://chatgpt.com/share/\u2026" value="${esc(data.chatLink||'')}"><div class="hint" id="linkhint">It should start with https://chatgpt.com/share/</div>${acts('setStage(6)','Continue','saveChatLink()',true)}`);
const chk=()=>{const v=$('chatlink').value.trim(),ok=SHARE_RE.test(v);$('next').disabled=!ok;$('linkhint').textContent=v&&!ok?'This does not look like a ChatGPT share link. It should start with https://chatgpt.com/share/':'It should start with https://chatgpt.com/share/';$('linkhint').className='hint'+(v&&!ok?' bad':'');};
$('chatlink').oninput=chk;chk();}
function saveChatLink(){const v=$('chatlink').value.trim();if(!SHARE_RE.test(v))return;data.chatLink=v;data.chatLinkAt=new Date().toISOString();setStage(8);}

function posttest(){quiz({eyebrow:'Post-test',doneLabel:'Submit post-test',items:mcItems('post'),back:()=>setStage(7),done:submitPosttest,intro:`<h2>Post-test</h2><p>Answer based on your understanding after the learning activity. Choose one answer for each question. There are six questions.</p>`});}
function submitPosttest(){const a=data.postAnswers;if(!a||a.length<6||a.includes(undefined))return;data.postScore=score('post',a);data.postCompletedAt=new Date().toISOString();setStage(9);}

function reflection(){const sc=(id,q,labels)=>({k:'sc',q,labels,get:()=>data[id],set:v=>{data[id]=v;}}),tx=(id,q)=>({k:'tx',q,get:()=>data[id]||'',set:v=>{data[id]=v;}});
quiz({eyebrow:'Reflection',doneLabel:'Finish activity',back:()=>setStage(8),done:submitReflection,intro:`<h2>Reflect on the learning activity</h2><p>There are no right or wrong answers. Please describe your experience honestly. Please answer every question before moving on.</p>`,items:[
sc('comfort','How comfortable did you feel asking ChatGPT questions about this topic?',['Not at all','Slightly','Moderately','Very','Extremely']),
tx('hesitation','Did you hesitate before asking any question, or choose not to ask something? If yes, what influenced that?'),
tx('phrasing','Did you change the way you phrased your questions during the conversation? If so, how or why?'),
sc('judgement','To what extent did you feel ChatGPT might judge you, misunderstand you, or form an impression of you?',['Not at all','A little','Somewhat','Quite a bit','A great deal']),
tx('account','Did using your personal ChatGPT account, or knowing the conversation could remain in your chat history, affect what you asked or how you asked it?'),
tx('perception','Did your perception of ChatGPT change during the interaction? If yes, what changed?')]});}
function submitReflection(){['hesitation','phrasing','account','perception'].forEach(id=>data[id]=(data[id]||'').trim());if(!data.comfort||!data.judgement||!data.hesitation||!data.phrasing||!data.account||!data.perception)return;data.finishedAt=new Date().toISOString();setStage(10);}

function complete(){if(data.submitted){done();return;}
const inel=!data.eligible;
view(`<div class="eyebrow">${inel?'Activity ended':'Activity complete'}</div><h2>Thank you for participating</h2><p>${inel?'Based on your answers you do not need to complete the learning activity. We are grateful for your time.':'You have completed all parts of the activity. We are very grateful for your time and your honest answers.'}</p>${!inel?`<div class="figs"><div class="fig"><b>${data.preScore}/6</b><span>Pre-test score</span></div><div class="fig"><b>${data.postScore}/6</b><span>Post-test score</span></div></div>`:''}<h3>One last question</h3><p>Would you be willing to be contacted later by the research team with follow-up questions?</p><div class="seg" role="radiogroup" aria-label="Willing to be contacted for follow-up questions">${[['yes','Yes, I am willing'],['no','No, thank you']].map(([v,t])=>`<label><input type="radio" name="fu" value="${v}" ${data.followUp===v?'checked':''}><span>${t}</span></label>`).join('')}</div><p class="fine" style="margin-top:12px">Your answer does not affect your participation. If you say no, the research team will not contact you about follow-up questions.</p><div id="contactBox"></div><div class="notice warn" id="submsg" hidden></div><button class="btn primary big-submit" id="submitBtn" onclick="submitStudy()" disabled>SUBMIT MY RESPONSES</button><p class="fine">Pressing Submit sends your responses to the research team. Please keep this page open until you see the confirmation.</p><p class="fine" style="margin-top:22px">Prefer not to submit online? <button class="linkbtn" onclick="printReport()">Download a copy of your answers</button>${RESEARCHER_CONTACT?` and email it to <a href="mailto:${esc(RESEARCHER_CONTACT)}?subject=Study%20responses">${esc(RESEARCHER_CONTACT)}</a>`:' and send it to the research team'}.</p>`);
app.querySelectorAll('input[name=fu]').forEach(e=>e.onchange=()=>{data.followUp=e.value;save();contactBox();});contactBox();}
const hasContact=()=>!!(data.email||data.whatsapp);
const needsContact=()=>data.followUp==='yes'&&!hasContact();
function contactOk(){if(!needsContact())return true;const e=data.cEmail||'',w=data.cWa||'',eo=e&&EMAIL_RE.test(e),wo=w&&waValid(w);return !!(eo||wo)&&(!e||!!eo)&&(!w||!!wo);}
function updateSubmit(){if(needsContact()){const e=data.cEmail||'',w=data.cWa||'';$('cemhint').textContent=e&&!EMAIL_RE.test(e)?'Please enter a valid email address.':'';$('cemhint').className='hint'+(e&&!EMAIL_RE.test(e)?' bad':'');$('cwahint').textContent=w&&!waValid(w)?'Please enter a valid number with your country code.':'Include your country code, for example +46 or +41.';$('cwahint').className='hint'+(w&&!waValid(w)?' bad':'');}
$('submitBtn').disabled=!(data.followUp&&contactOk());}
function contactBox(){const b=$('contactBox');if(!b)return;
if(needsContact()){b.innerHTML=`<div class="notice"><b>How can we reach you?</b><br>You said you are willing to be contacted, but you did not add contact details earlier. Please add at least one below.</div><label class="field" for="cemail">Email address</label><input id="cemail" type="email" maxlength="200" autocomplete="email" inputmode="email" placeholder="name@example.com" value="${esc(data.cEmail||'')}"><div class="hint" id="cemhint"></div><label class="field" for="cwa">WhatsApp number</label><input id="cwa" type="tel" maxlength="30" autocomplete="tel" inputmode="tel" placeholder="+46 70 123 45 67" value="${esc(data.cWa||'')}"><div class="hint" id="cwahint"></div>`;
['cemail','cwa'].forEach(id=>$(id).oninput=()=>{data.cEmail=$('cemail').value.trim();data.cWa=$('cwa').value.trim();updateSubmit();});}
else b.innerHTML=data.followUp==='yes'?'<p class="fine">We will use the contact details you gave earlier.</p>':'';
updateSubmit();}
function done(){view(`<div class="eyebrow">Submitted</div><h2>Your responses have been submitted</h2><p class="lead">Thank you for taking part. You can now close this page.</p><p>${data.followUp==='yes'?'You said you are happy to be contacted for follow-up questions, so the research team may get in touch with you.':'You said you would prefer not to be contacted again, so the research team will not contact you about follow-up questions.'}</p>${RESEARCHER_CONTACT?`<p class="fine">Questions, or want to withdraw your data? Contact ${esc(RESEARCHER_CONTACT)}.</p>`:''}<p class="fine">Optional: you can download a copy of your answers for your own records.</p><div class="actions"><span></span><button class="btn ghost" onclick="printReport()">Download a copy (PDF)</button></div>`);}
function uuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;}
function answerRows(key){const a=data[key+'Answers'];if(!a)return undefined;return bank[pathway][key].map((q,i)=>({q:i+1,question:q[0],selected:q[1][a[i]],correct:a[i]===q[2]}));}
function buildRow(){if(!data.id)data.id=uuid();return{id:data.id,name:data.name,email:data.email||undefined,whatsapp:data.whatsapp||undefined,gender:data.gender,module:data.module,age:data.age,chatgpt_primary:data.chatgptPrimary==='yes',consent:data.consent===true,consent_at:data.consentAt,consent_version:data.consentVersion,started_at:data.startedAt,finished_at:data.finishedAt||new Date().toISOString(),eligible:data.eligible,pre_score:data.preScore,confidence_avg:data.confidenceAverage,confidence:data.confidence,pre_answers:answerRows('pre'),exploration_seconds:data.explorationDurationSeconds,chat_link:data.chatLink,post_score:data.postScore,post_answers:answerRows('post'),comfort:data.comfort,judgement:data.judgement,hesitation:data.hesitation,phrasing:data.phrasing,account_reflection:data.account,perception:data.perception,followup_ok:data.followUp==='yes',criteria_version:data.criteriaVersion};}
const notConfigured=()=>BACKEND==='google'?GOOGLE_SCRIPT_URL.includes('YOUR-DEPLOYMENT'):(SUPABASE_URL.includes('YOUR-PROJECT')||SUPABASE_KEY.startsWith('YOUR-'));
async function sendRow(row,signal){
if(BACKEND==='google'){const res=await fetch(GOOGLE_SCRIPT_URL,{method:'POST',signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)});let j=null;try{j=await res.json();}catch(e){}
return{ok:!!(j&&j.ok),status:res.status,detail:j&&j.error||''};}
const res=await fetch(SUPABASE_URL+'/rest/v1/submissions',{method:'POST',signal,headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Prefer':'return=minimal'},body:JSON.stringify(row)});
let d='';if(!res.ok&&res.status!==409){try{d=(await res.text()).slice(0,200);}catch(e){}}
return{ok:res.ok||res.status===409,status:res.status,detail:d};}
async function submitStudy(){if(!data.followUp||!contactOk())return;const btn=$('submitBtn'),msg=$('submsg');msg.hidden=true;btn.disabled=true;btn.textContent='Submitting\u2026';
const fail=t=>{msg.hidden=false;msg.innerHTML=`<b>Your responses have not been sent yet.</b><br>${t}<br><br><button class="btn ghost" onclick="printReport()">Download a backup copy (PDF)</button>${RESEARCHER_CONTACT?`<br><span class="fine">If this keeps happening, contact ${esc(RESEARCHER_CONTACT)} and send the backup copy.</span>`:''}`;btn.disabled=false;btn.textContent='TRY AGAIN';};
if(notConfigured()){fail('This study page has not been connected to its data store yet. Please tell the research team.');btn.textContent='SUBMIT MY RESPONSES';return;}
if(needsContact()){data.email=data.cEmail||'';data.whatsapp=data.cWa||'';}
try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
const r=await sendRow(buildRow(),ctl.signal);clearTimeout(t);
if(r.ok){data.submitted=true;dirty=false;try{localStorage.removeItem('reproStudyDraft');}catch(e){}done();window.scrollTo(0,0);}
else{console.error('Submit failed',r.status,r.detail);fail('The server did not accept the submission'+(r.status?' (error '+r.status+')':'')+'. Please try again.');}}
catch(e){console.error(e);fail('We could not reach the server. Please check your internet connection and try again.');}}

function printReport(){const r=buildReport(),w=window.open('','_blank');
if(w){w.document.open();w.document.write(r);w.document.close();setTimeout(()=>{w.focus();w.print();},500);return;}
const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);f.onload=()=>{f.contentWindow.focus();f.contentWindow.print();};f.srcdoc=r;}
function buildReport(){const answerBlock=(key,label)=>{if(!data[key+'Answers'])return '';const qs=bank[pathway][key];return `<h2>${label}</h2>${qs.map((q,i)=>`<div class="item"><b>${i+1}. ${esc(q[0])}</b><p>Selected answer: ${esc(q[1][data[key+'Answers'][i]])}</p><p>Correct answer: ${esc(q[1][q[2]])}</p><p>Result: ${data[key+'Answers'][i]===q[2]?'Correct':'Incorrect'}</p></div>`).join('')}`;};const conf=data.confidence?data.confidence.map((v,i)=>`<li>${esc(confidenceItems[i])} <b>${v}/5</b></li>`).join(''):'';const reflectionRows=['hesitation','phrasing','account','perception'].map((id,i)=>`<div class="item"><b>${['Hesitation / omitted questions','Changes in phrasing','Personal account / chat history','Change in perception'][i]}</b><p>${esc(data[id]||'No response')}</p></div>`).join('');return `<!doctype html><html><head><meta charset="utf-8"><title>Participant research report</title><style>body{font:12px/1.5 Arial,sans-serif;color:#222;margin:28px}h1{font-size:23px}h2{font-size:17px;border-bottom:1px solid #bbb;padding-bottom:5px;margin-top:25px}.meta{background:#f2f5f2;padding:12px}.item{border-bottom:1px solid #ddd;padding:8px 0;break-inside:avoid}p{margin:4px 0}.small{color:#555;font-size:11px}@media print{body{margin:16mm}h2{break-after:avoid}}</style></head><body><h1>Reproductive Anatomy Learning Activity<br>Participant Report</h1><p class="small">Generated: ${esc(new Date().toLocaleString())}</p>${RESEARCHER_CONTACT?`<p><b>Please email this report (saved as a PDF) to ${esc(RESEARCHER_CONTACT)}.</b></p>`:''}<div class="meta"><p><b>Participant name:</b> ${esc(data.name)}</p><p><b>Age:</b> ${esc(data.age||'')}</p><p><b>ChatGPT is one of my most used AI tools:</b> ${data.chatgptPrimary==='yes'?'Yes':data.chatgptPrimary==='no'?'No':'Not answered'}</p><p><b>Email:</b> ${esc(data.email||(data.followUp==='yes'&&data.cEmail)||'Not provided')}</p><p><b>WhatsApp:</b> ${esc(data.whatsapp||(data.followUp==='yes'&&data.cWa)||'Not provided')}</p><p><b>Shared chat link:</b> ${esc(data.chatLink||'Not provided')}</p><p><b>Willing to be contacted for follow-up:</b> ${data.followUp==='yes'?'Yes':data.followUp==='no'?'No':'Not answered'}</p><p><b>Gender selected:</b> ${esc(data.gender)}</p><p><b>Assigned module:</b> ${esc(data.module)}</p><p><b>Consent confirmed:</b> ${data.consent?'Yes':'No'}</p><p><b>Eligibility:</b> ${data.eligible?'Eligible':'Not eligible'}</p><p><b>Activity started:</b> ${esc(data.startedAt||'')}</p><p><b>Activity completed:</b> ${esc(data.finishedAt||data.preCompletedAt||'')}</p></div>${answerBlock('pre','Pre-test responses')}<h2>Confidence assessment</h2><ol>${conf}</ol><p><b>Average confidence:</b> ${data.confidenceAverage!==undefined?data.confidenceAverage.toFixed(2)+'/5':'Not recorded'}</p><p><b>Pre-test score:</b> ${data.preScore!==undefined?data.preScore+'/6':'Not recorded'}</p><p><b>Eligibility rule:</b> Knowledge score ≤ 3/6 AND confidence average ≤ 3/5.</p><p><b>Eligibility outcome:</b> ${data.eligible?'Met both criteria':'Did not meet both criteria'}</p><h2>Learning activity</h2><p><b>Exploration completed:</b> ${data.explorationCompleted?'Yes':'No / not applicable'}</p><p><b>Time on timer:</b> ${data.explorationDurationSeconds!==undefined?Math.floor(data.explorationDurationSeconds/60)+' min '+data.explorationDurationSeconds%60+' sec':'Not recorded'}</p>${answerBlock('post','Post-test responses')}<p><b>Post-test score:</b> ${data.postScore!==undefined?data.postScore+'/6':'Not recorded / not applicable'}</p><h2>Reflection responses</h2><p><b>Comfort asking questions:</b> ${data.comfort?data.comfort+'/5':'Not recorded'}</p><p><b>Perceived possibility of judgement / misunderstanding:</b> ${data.judgement?data.judgement+'/5':'Not recorded'}</p>${reflectionRows}<h2>Session summary</h2><p><b>Pre-test:</b> ${data.preScore??'—'}/6. <b>Confidence average:</b> ${data.confidenceAverage!==undefined?data.confidenceAverage.toFixed(2):'—'}/5. <b>Eligibility:</b> ${data.eligible?'Eligible':'Not eligible'}.</p><p><b>Post-test:</b> ${data.postScore!==undefined?data.postScore+'/6':'Not completed'}.</p><p class="small">This copy was generated on the participant\u2019s device from the study page.</p></body></html>`;}
